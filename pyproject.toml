[project]
name = "binder-builder"
version = "0.1.0"
description = "Pokemon TCG collection tracker, set-completion optimizer, and binder designer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "numpy>=2.1",
    "typer>=0.15",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "rich>=13.9",
    "reportlab>=4.2",
    "pillow>=11.0",
    # FastAPI needs this to parse multipart bodies; the insert upload (3.4) is the only
    # endpoint in the project that takes a file.
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13", "respx>=0.22"]

[project.scripts]
bb = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated by `alembic revision --autogenerate`; not hand-formatted, so don't lint line
# length or import order on them.
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# FastAPI's Depends()/Query()/etc. in argument defaults is the required pattern, not the B008
# footgun that rule exists for (Typer's typer.Option() is the same story -- noqa'd inline since
# there are only a couple of call sites, not enough to warrant a blanket exemption there too).
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-m 'not slow'"
markers = [
    "slow: performance benchmarks, skipped by default -- run explicitly with `-m slow`",
]
