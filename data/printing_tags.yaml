# What the bracketed tags in tcgcsv product names mean -- "Pikachu - 027 (Prerelease)",
# "Aerodactyl (Delta Species)", "Exeggcute (Poke Ball Pattern)".
#
# TCGplayer sells a stamped or pattern printing as its OWN product, separate from the card's base
# product, and also uses the same bracket syntax for plain disambiguation. The price ingest
# (app/ingest/prices.py) reads this file to tell the three apart; a tag not listed here is logged
# and the product is left unmatched -- never guessed. Every entry below was observed in the live
# feed in the 2026-10-25 survey of all 169 mapped groups (counts are products that tag landed on
# a known card); add new tags here when `bb ingest prices` reports them.
#
# Kinds:
#   name_tags   Part of the card's identity, not a printing: "Aerodactyl (Delta Species)" is
#               simply the card Aerodactyl delta species. Stripped before matching; the product
#               then supplies the card's ordinary Normal / Holo / Reverse printings.
#   printings   A distinct printing of a card that also has an untagged version. Each becomes its
#               own card_variant, keyed by `slug`, with its own product id and price.
#                 scope: set      pulled from packs of the set itself -> part of a Master Set
#                 scope: special  stamps, promos, events, errors     -> Grand Master Set only
#   patterns    Like printings, for tags carrying a year or placement. Each distinct value is a
#               SEPARATE printing ("Worlds 2023" and "Worlds 2024" are different cards to a
#               collector). `{year}` is normalised to four digits.
#
# A special printing is only a variant when there is an unstamped version to vary from. When a
# card's ONLY product carries a special tag (many promos were only ever released stamped), that
# product is treated as the card's base printing instead -- see prices.py.
#
# Lookup is case-insensitive. A tag is tried as written, then with a leading number removed
# ("98 Full Art" -> "Full Art", "151 Metal Card" -> "Metal Card"). Two printing tags on one
# product ("(Prerelease) (Staff)") are looked up joined with " + ".

name_tags:
  - Delta Species          # 179, EX era
  - Delta                  # "8 Delta", XY Fates Collide
  - Team Plasma            # 84, BW Plasma sets
  - Prime                  # 31, HGSS
  - Shiny                  # 25
  - Special                # Special energy, 18
  - Basic                  # Basic energy
  - Secret                 # 17
  - Secret Rare
  - Full Art               # 9, plus numbered "98 Full Art" etc.
  - Alternate Full Art
  - Full Art Secret Rare
  - Shiny Full Art
  - Texture Full Art       # Crown Zenith energies
  - Full Art Promo         # XY promos
  - Holo Common            # Detective Pikachu holo commons
  - Holo                   # POP series ex: separate holo product
  - Non-Holo               # POP series ex: separate non-holo product
  - Alpha                  # Primal Clash
  - Omega
  - Top                    # HGSS LEGEND halves
  - Bottom
  - Supporter              # "N (Supporter)"
  - Rocket's Secret Machine
  - Goldenrod Game Corner
  - Red                    # Gyarados (Red), HGSS
  - High Plains [Orange]   # Vivillon forms
  - Meadow [Pink]
  - Attack Forme           # Deoxys / Shaymin formes
  - Defense Forme
  - Normal Forme
  - Speed Forme
  - Land Forme
  - Sky Forme
  - Delta Species - Attack Forme
  - Delta Species - Defense Forme
  - Delta Species - Normal Forme
  - Delta Species - Speed Forme
  # Ditto disguises, EX FireRed & LeafGreen
  - Bulbasaur
  - Charmander
  - Squirtle
  - Pikachu
  - Mr. Mime
  - Geodude
  # Gym Badge trainers, XY promos
  - Brock
  - Misty
  - Lt. Surge
  - Erika
  - Koga
  - Sabrina
  - Blaine
  - Giovanni

# Regex name tags: Unown letters "(A)".."(Z)", "(!)", "(?)"; e-Card holo numbers "(H1)".."(H32)";
# bare number disambiguators "(002)".
name_tag_patterns:
  - '^[a-z!?]$'
  - '^h\d+$'
  - '^\d+[a-z]?$'

