patterns:
  # Worlds stamps -- one printing per year, as the owner asked. All three spellings occur.
  - {regex: '^(?:worlds|world championships?) (?P<year>\d{2}|\d{4})$', slug: 'worlds_{year}',
     label: 'Worlds {year} stamp', scope: special}
  - {regex: '^(?P<year>\d{4}) world championships$', slug: 'worlds_{year}',
     label: 'Worlds {year} stamp', scope: special}
  # Champions Festival placement stamps (XY era), one printing per year AND placement.
  - {regex: '^(?P<year>\d{4}) top thirty-two$', slug: 'worlds_{year}_top_32',
     label: 'Worlds {year} Top 32', scope: special}
  - {regex: '^(?P<year>\d{4}) top sixteen$', slug: 'worlds_{year}_top_16',
     label: 'Worlds {year} Top 16', scope: special}
  - {regex: '^(?P<year>\d{4}) quarter finalist$', slug: 'worlds_{year}_quarterfinal',
     label: 'Worlds {year} Quarter-finalist', scope: special}
  - {regex: '^(?P<year>\d{4}) semi-finalist$', slug: 'worlds_{year}_semifinal',
     label: 'Worlds {year} Semi-finalist', scope: special}
  - {regex: '^(?P<year>\d{4}) finalist$', slug: 'worlds_{year}_finalist',
     label: 'Worlds {year} Finalist', scope: special}
  - {regex: '^(?P<year>\d{4}) champion$', slug: 'worlds_{year}_champion',
     label: 'Worlds {year} Champion', scope: special}
  - {regex: '^(?P<year>\d{4}) staff$', slug: 'worlds_{year}_staff', label: 'Worlds {year} Staff',
     scope: special}
  - {regex: '^illustration contest (?P<year>\d{4})$', slug: 'illustration_contest_{year}',
     label: 'Illustration Contest {year}', scope: special}
  - {regex: '^battle road (?P<season>autumn|spring) (?P<year>\d{4})$', slug: 'battle_road_{season}_{year}',
     label: 'Battle Road {season} {year}', scope: special}
