# Paldea Evolved (sv2) - standard booster.
#
# Hit-rarity probabilities are taken directly from TCGplayer's Authentication Center study:
# 8,000+ real booster packs opened, reported with a 95% confidence interval per rarity. Card
# counts per rarity in that article (17 Double Rare, 26 Ultra Rare, 36 Illustration Rare, 15
# Special Illustration Rare, 9 Hyper Rare) match this project's ingested card data for sv2
# exactly. No ACE SPEC Rare here -- ACE SPECs weren't introduced until Temporal Forces (sv5), and
# sv2 has no cards of that rarity, so the first reverse-holo slot is plain filler only.
#
# NOT independently sourced: the split of each reverse-holo slot's leftover probability across
# Common/Uncommon/Rare reverse holo (55/35/10) is this project's own placeholder assumption, not
# from TCGplayer -- see sv8.yaml's notes for the same caveat. That's why this is `medium`, not
# `high`, confidence.
#
# NOT modeled: box-level collation guarantees. None are declared here (packs treated as
# independent draws) because TCGplayer's methodology samples packs, not boxes.

set: sv2
name: "Paldea Evolved - standard booster"
cards_per_pack: 10
confidence: medium
sample_packs: 8000
source_urls:
  - https://www.tcgplayer.com/content/article/Pok%C3%A9mon-TCG-Paldea-Evolved-Pull-Rates/1b7d3e70-9542-4a50-8692-1661e2316521/
notes: >
  TCGplayer Authentication Center, 8,000+ packs, 95% CI, updated 2025-02-27. Hit rates: Double
  Rare 13.72% +/- 0.73%, Ultra Rare 6.64% +/- 0.53%, Illustration Rare 7.70% +/- 0.56%, Special
  Illustration Rare 3.17% +/- 0.37%, Hyper Rare 1.76% +/- 0.28%. About 18% of packs contain some
  Secret Rare (Ultra/Illustration/Special Illustration/Hyper). Least trusted figure: the 55/35/10
  reverse-holo filler split (not from TCGplayer) and the total absence of box_constraints.

slots:
  - index: 1
    label: common
    repeat: 4
    outcomes:
      - {rarity: "Common", probability: 1.0}

  - index: 5
    label: uncommon
    repeat: 3
    outcomes:
      - {rarity: "Uncommon", probability: 1.0}

  - index: 8
    label: reverse_holo_plain
    repeat: 1
    outcomes:
      - {rarity: "Common", probability: 0.55, variant: reverse_holofoil}
      - {rarity: "Uncommon", probability: 0.35, variant: reverse_holofoil}
      - {rarity: "Rare", probability: 0.1, variant: reverse_holofoil}

  - index: 9
    label: reverse_holo_hit
    repeat: 1
    outcomes:
      - {rarity: "Illustration Rare", probability: 0.077, variant: holofoil}
      - {rarity: "Special Illustration Rare", probability: 0.0317, variant: holofoil}
      - {rarity: "Hyper Rare", probability: 0.0176, variant: holofoil}
      - {rarity: "Common", probability: 0.480535, variant: reverse_holofoil}
      - {rarity: "Uncommon", probability: 0.305795, variant: reverse_holofoil}
      - {rarity: "Rare", probability: 0.08737, variant: reverse_holofoil}

  - index: 10
    label: rare
    repeat: 1
    outcomes:
      - {rarity: "Double Rare", probability: 0.1372, variant: holofoil}
      - {rarity: "Ultra Rare", probability: 0.0664, variant: holofoil}
      - {rarity: "Rare", probability: 0.7964, variant: holofoil}

box_constraints: []
