# Vivid Voltage (swsh4) - standard booster.
#
# Previously on the "blocked, no source found" list (docs/07-data-backlog.md 2b): this set
# introduces the one-off "Amazing Rare" rarity, and an earlier pass through TCGplayer's
# Authentication Center articles and thepricedex.com found nothing covering it. Re-checked
# 2026-08-25 and thepricedex.com does in fact have a Vivid Voltage page with Amazing Rare odds
# (1 in 17.5 packs) -- the earlier pass evidently missed it. A second aggregator (pullrates.com)
# also lists Vivid Voltage but gives a materially different Amazing Rare figure (1 in 5, no
# sample size or methodology disclosed) -- thepricedex is used here for consistency with the
# other six SWSH-era profiles in this project, not because it was corroborated against
# pullrates.com; the disagreement between the two sites is itself evidence these are rough
# community estimates, not settled numbers.
#
# Hit-rarity odds (Rare Secret through plain Rare in the "rare-or-better" slot) come from
# thepricedex.com's per-set pull-rate page, itself described as "estimates primarily sourced from
# Vivid Voltage pull rates research and supplementary analysis, based on community data" -- a
# third-party aggregator citing community research, not a first-party study this project
# independently verified. Sample size: not disclosed on the page. That is why this profile is
# `confidence: low`, unlike the TCGplayer-sourced sv2/sv7/sv8/sv3pt5 profiles (`medium`).
# thepricedex reports odds as "1 in X packs" per rarity; converting to probability and summing
# came to ~106.3% instead of 100% (a bigger gap than this project's other five thepricedex-sourced
# SWSH profiles, which were all within ~1-2%, but the same renormalization recipe is applied:
# each raw probability divided by the raw sum so they total exactly 1.0).
#
# NOT independently sourced for this set: the reverse-holo slot's split across
# Common/Uncommon/Rare/Rare Holo. thepricedex's Darkness Ablaze (swsh3) page is the only one of
# the SWSH-era pages used in this project that reports reverse-card odds directly; that split is
# reused as-is for Vivid Voltage as a same-era approximation, not re-derived per set (same
# treatment as swsh1/swsh2/swsh5/swsh6/swsh8).
#
# NOT modeled: box-level collation guarantees (none declared) and the guaranteed Energy card slot
# (no generically-priced basic Energy card rows exist in this project's catalog for swsh4 to
# attach a probability to -- same reasoning as sv3pt5.yaml's unmodeled Foil Energy slot).
#
# Data-quality note: this project's ingested card_variant rows for swsh4's Rare Ultra/Rare
# Rainbow/Rare Secret were, until 2026-08-25, entirely unpriced (a card→product name-matching gap
# in app/ingest/mapping.py -- see docs/07-data-backlog.md 3 for the root cause and fix). Re-running
# `bb ingest prices --group 2701` after the fix brought coverage to 37 of 38 cards across those
# three rarities; one residual case ("Pokémon Center Lady" vs tcgcsv's "Pokemon Center Lady Full
# Art") is an accented-character name mismatch, not a treatment-suffix one.

set: swsh4
name: "Vivid Voltage - standard booster"
cards_per_pack: 10
confidence: low
sample_packs: null
source_urls:
  - https://www.thepricedex.com/set/swsh4/vivid-voltage/pull-rates
notes: >
  thepricedex.com, community-aggregated estimates (see header comment for the full caveat).
  Rare-or-better odds as published (1 in X packs): Rare Secret 1/90.1, Rainbow Rare 1/78.7,
  Ultra Rare 1/25.2, Rare Holo VMAX 1/23.3, Rare Holo V 1/7.9, Amazing Rare 1/17.5,
  Rare Holo 1/4.6, Rare 1/1.8. Least trusted figures: the whole profile, frankly -- unlike
  sv2/sv7/sv8/sv3pt5 this is a third-party aggregation of unverified community research, not a
  first-party study, and the Amazing Rare figure specifically disagrees with a second aggregator
  (pullrates.com: 1 in 5) with no way to adjudicate between them. Treat as a starting point, not
  a settled number.

slots:
  - index: 1
    label: common
    repeat: 5
    outcomes:
      - {rarity: "Common", probability: 1.0}

  - index: 6
    label: uncommon
    repeat: 3
    outcomes:
      - {rarity: "Uncommon", probability: 1.0}

  - index: 9
    label: reverse_holo
    repeat: 1
    outcomes:
      - {rarity: "Rare Holo", probability: 0.116154, variant: reverse_holofoil}
      - {rarity: "Rare", probability: 0.217157, variant: reverse_holofoil}
      - {rarity: "Uncommon", probability: 0.322233, variant: reverse_holofoil}
      - {rarity: "Common", probability: 0.344456, variant: reverse_holofoil}

  - index: 10
    label: rare_or_better
    repeat: 1
    outcomes:
      - {rarity: "Rare Secret", probability: 0.010440, variant: holofoil}
      - {rarity: "Rare Rainbow", probability: 0.011953, variant: holofoil}
      - {rarity: "Rare Ultra", probability: 0.037328, variant: holofoil}
      - {rarity: "Rare Holo VMAX", probability: 0.040372, variant: holofoil}
      - {rarity: "Rare Holo V", probability: 0.119072, variant: holofoil}
      - {rarity: "Amazing Rare", probability: 0.053752, variant: holofoil}
      - {rarity: "Rare Holo", probability: 0.204492, variant: holofoil}
      - {rarity: "Rare", probability: 0.522591, variant: normal}

box_constraints: []
