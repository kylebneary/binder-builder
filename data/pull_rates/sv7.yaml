# Stellar Crown (sv7) - standard booster.
#
# Hit-rarity probabilities are taken directly from TCGplayer's Authentication Center study:
# 8,000+ real booster packs opened, reported with a 95% confidence interval per rarity. Card
# counts per rarity in that article (14 Double Rare, 11 Ultra Rare, 3 ACE SPEC Rare, 13
# Illustration Rare, 6 Special Illustration Rare, 3 Hyper Rare) match this project's ingested
# card data for sv7 exactly.
#
# NOT independently sourced: the split of each reverse-holo slot's leftover probability across
# Common/Uncommon/Rare reverse holo (55/35/10) is this project's own placeholder assumption, not
# from TCGplayer -- see sv8.yaml's notes for the same caveat. That's why this is `medium`, not
# `high`, confidence.
#
# NOT modeled: box-level collation guarantees. None are declared here (packs treated as
# independent draws) because TCGplayer's methodology samples packs, not boxes.

set: sv7
name: "Stellar Crown - standard booster"
cards_per_pack: 10
confidence: medium
sample_packs: 8000
source_urls:
  - https://www.tcgplayer.com/content/article/Pok%C3%A9mon-TCG-Stellar-Crown-Pull-Rates/2c0743dd-dbd0-4504-9ff8-be5a72dd04d1/
notes: >
  TCGplayer Authentication Center, 8,000+ packs, 95% CI, updated 2025-02-27. Hit rates: Double
  Rare 16.90% +/- 0.79%, Ultra Rare 6.75% +/- 0.53%, ACE SPEC Rare 4.94% +/- 0.46%, Illustration
  Rare 7.79% +/- 0.57%, Special Illustration Rare 1.11% +/- 0.22%, Hyper Rare 0.73% +/- 0.18%.
  Stellar Crown is a smaller set (33 Secret Rares vs. 56-59 in neighboring sets), so specific-card
  odds are noticeably better than Surging Sparks despite near-identical per-rarity rates. Note:
  TCGplayer flagged Dachsbun ex's individual pull rate as a likely short print within the Double
  Rare pool -- this profile does not model per-card weighting (docs/04-optimizer-spec.md supports
  a per-card `weight` override for exactly this case; not applied here, treat as a known gap).
  Least trusted figure: the 55/35/10 reverse-holo filler split (not from TCGplayer) and the total
  absence of box_constraints.

slots:
  - index: 1
    label: common
    repeat: 4
    outcomes:
      - {rarity: "Common", probability: 1.0}

  - index: 5
    label: uncommon
    repeat: 3
    outcomes:
      - {rarity: "Uncommon", probability: 1.0}

  - index: 8
    label: reverse_holo_ace_spec
    repeat: 1
    outcomes:
      - {rarity: "ACE SPEC Rare", probability: 0.0494, variant: holofoil}
      - {rarity: "Common", probability: 0.52283, variant: reverse_holofoil}
      - {rarity: "Uncommon", probability: 0.33271, variant: reverse_holofoil}
      - {rarity: "Rare", probability: 0.09506, variant: reverse_holofoil}

  - index: 9
    label: reverse_holo_hit
    repeat: 1
    outcomes:
      - {rarity: "Illustration Rare", probability: 0.0779, variant: holofoil}
      - {rarity: "Special Illustration Rare", probability: 0.0111, variant: holofoil}
      - {rarity: "Hyper Rare", probability: 0.0073, variant: holofoil}
      - {rarity: "Common", probability: 0.497035, variant: reverse_holofoil}
      - {rarity: "Uncommon", probability: 0.316295, variant: reverse_holofoil}
      - {rarity: "Rare", probability: 0.09037, variant: reverse_holofoil}

  - index: 10
    label: rare
    repeat: 1
    outcomes:
      - {rarity: "Double Rare", probability: 0.169, variant: holofoil}
      - {rarity: "Ultra Rare", probability: 0.0675, variant: holofoil}
      - {rarity: "Rare", probability: 0.7635, variant: holofoil}

box_constraints: []
