# Scarlet & Violet--151 (sv3pt5) - standard booster.
#
# Hit-rarity probabilities are from TCGplayer's Authentication Center study: 1,500+ real booster
# packs, 95% CI. Card counts per rarity (12 Double Rare, 16 Ultra Rare, 16 Illustration Rare, 7
# Special Illustration Rare, 3 Hyper Rare) match this project's ingested card data for sv3pt5
# exactly. No ACE SPEC Rare -- 151 predates Temporal Forces, same as sv2/sv7/sv8's earlier sets.
#
# NOT modeled: the "Foil Energy" slot. TCGplayer's article reports that ~25% of 151 packs contain
# a Cosmos Holofoil basic Energy card (in addition to the 10 cards modeled here), separately from
# the two Reverse Holo slots and the Rare slot. This project's card catalog only has one Energy
# card ingested for sv3pt5 -- "Basic Psychic Energy", itself one of the three Hyper Rare cards
# already counted in the reverse_holo_hit slot below -- the seven other basic Energy types
# (Darkness/Fighting/Fire/Grass/Lightning/Metal/Water) aren't in the DB as priced card rows, so
# there's no card_variant to attach an extra slot's probability to. Sample size is also smaller
# here (1,500 vs. 8,000 packs for sv2/sv7/sv8), for a wider stated confidence interval throughout.
#
# NOT independently sourced: the 55/35/10 reverse-holo filler split and box_constraints -- see
# sv8.yaml's notes for the same caveat, which applies identically here.

set: sv3pt5
name: "Scarlet & Violet--151 - standard booster"
cards_per_pack: 10
confidence: medium
sample_packs: 1500
source_urls:
  - https://www.tcgplayer.com/content/article/Pok%C3%A9mon-TCG-Scarlet-Violet%E2%80%94151-Pull-Rates/b237df74-fbb0-40d0-9e13-d69ee6e804d9/
notes: >
  TCGplayer Authentication Center, 1,500+ packs, 95% CI, updated 2025-02-27. Hit rates: Double
  Rare 13.28% +/- 1.57%, Ultra Rare 6.44% +/- 1.13%, Illustration Rare 8.50% +/- 1.29%, Special
  Illustration Rare 3.11% +/- 0.80%, Hyper Rare 1.94% +/- 0.64%. Wider confidence intervals than
  sv2/sv7/sv8 because the sample is smaller (1,500 vs. 8,000+ packs). Illustration Rare Caterpie
  pulled outside its rarity's 95% CI in TCGplayer's sample (possible short print, not modeled
  here -- docs/04-optimizer-spec.md's per-card `weight` override exists for exactly this, unused).
  Least trusted figures: the unmodeled Foil Energy slot (see header), the 55/35/10 reverse-holo
  filler split, and the absence of box_constraints.

slots:
  - index: 1
    label: common
    repeat: 4
    outcomes:
      - {rarity: "Common", probability: 1.0}

  - index: 5
    label: uncommon
    repeat: 3
    outcomes:
      - {rarity: "Uncommon", probability: 1.0}

  - index: 8
    label: reverse_holo_plain
    repeat: 1
    outcomes:
      - {rarity: "Common", probability: 0.55, variant: reverse_holofoil}
      - {rarity: "Uncommon", probability: 0.35, variant: reverse_holofoil}
      - {rarity: "Rare", probability: 0.1, variant: reverse_holofoil}

  - index: 9
    label: reverse_holo_hit
    repeat: 1
    outcomes:
      - {rarity: "Illustration Rare", probability: 0.085, variant: holofoil}
      - {rarity: "Special Illustration Rare", probability: 0.0311, variant: holofoil}
      - {rarity: "Hyper Rare", probability: 0.0194, variant: holofoil}
      - {rarity: "Common", probability: 0.475475, variant: reverse_holofoil}
      - {rarity: "Uncommon", probability: 0.302575, variant: reverse_holofoil}
      - {rarity: "Rare", probability: 0.08645, variant: reverse_holofoil}

  - index: 10
    label: rare
    repeat: 1
    outcomes:
      - {rarity: "Double Rare", probability: 0.1328, variant: holofoil}
      - {rarity: "Ultra Rare", probability: 0.0644, variant: holofoil}
      - {rarity: "Rare", probability: 0.8028, variant: holofoil}

box_constraints: []
